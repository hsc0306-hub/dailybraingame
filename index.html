 const flash=t=>{fl.textContent=t;fl.style.opacity=1;fl.classList.remove('pop');void fl.offsetWidth;fl.classList.add('pop');clearTimeout(fl._h);fl._h=setTimeout(()=>fl.style.opacity=0,900)};
 const die=why=>{if(inv>0||dead)return;splash={x:F.x,r:F.r,t:.6,why};lives--;showH();c.bad();flash(why==='water'?'풍덩!':'쾅!');
  if(lives<=0){dead=true;c.prompt('끝!');c.later(c.end,1000);return}inv=1.2;reset()};
 const move=dir=>{if(dead||F.hop>0)return;const nc=F.c+(dir==='l'?-1:dir==='r'?1:0),nr=F.r+(dir==='u'?-1:dir==='d'?1:0);
  if(nc<0||nc>=COLS||nr<0||nr>ROWS-1)return;F.face={u:0,r:1,d:2,l:3}[dir];F.fx=F.x;F.fy=F.r;F.c=nc;F.r=nr;F.x=L[F.r].t==='river'?F.x+(dir==='l'?-1:dir==='r'?1:0):nc;F.hop=1;
  if(nr<best){best=nr;c.ok(1)}
  if(nr===0){c.ok(10);level++;flash('도착! '+(level+1)+'단계');build();c.later(reset,150)}};
 c.el.querySelectorAll('.dpad .btn').forEach(b=>b.onpointerdown=e=>{e.preventDefault();move({t:'u',b:'d',l:'l',r:'r'}[b.dataset.d])});
 document.onkeydown=e=>{const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key];if(m){e.preventDefault();move(m)}};
 let sx=0,sy=0;cv.style.touchAction='none';
 cv.onpointerdown=e=>{sx=e.clientX;sy=e.clientY};
 cv.onpointerup=e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<18){move('u');return}move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))};
 const wrap=(v,p)=>((v%p)+p)%p;
 const objX=(o,ln)=>wrap(o.x+ln.off,ln.period)-(ln.period-COLS)/2;
 const rr=(X,Y,w,h,r,col)=>{x.fillStyle=col;x.beginPath();x.roundRect?x.roundRect(X,Y,w,h,r):x.rect(X,Y,w,h);x.fill()};
 const drawFrog=(px,py,s,face)=>{x.save();x.translate(px,py);x.rotate(face*Math.PI/2);
  x.fillStyle='#2f9e44';[[-.32,.28],[.32,.28],[-.3,-.2],[.3,-.2]].forEach(([a,b])=>{x.beginPath();x.ellipse(a*s,b*s,s*.16,s*.11,0,0,7);x.fill()});
  x.fillStyle='#51cf66';x.beginPath();x.ellipse(0,0,s*.3,s*.34,0,0,7);x.fill();
  x.fillStyle='#8ce99a';x.beginPath();x.ellipse(0,s*.06,s*.17,s*.2,0,0,7);x.fill();
  x.fillStyle='#fff';[-1,1].forEach(k=>{x.beginPath();x.arc(k*s*.14,-s*.26,s*.1,0,7);x.fill()});
  x.fillStyle='#1b2240';[-1,1].forEach(k=>{x.beginPath();x.arc(k*s*.14,-s*.28,s*.05,0,7);x.fill()});x.restore()};
 L.forEach(l=>l.off=0);
 c.frame(()=>{const n=performance.now(),dt=Math.min(.05,(n-last)/1000);last=n;inv=Math.max(0,inv-dt);
  L.forEach(l=>{if(l.v){l.off=(l.off||0)+l.dir*l.v*dt}});
  if(F.hop>0)F.hop=Math.max(0,F.hop-dt*7);
  const ln=L[F.r];
  if(!dead&&F.hop===0){
   if(ln.t==='river'){F.x+=ln.dir*ln.v*dt;const on=ln.o.some(o=>{const ox=objX(o,ln);return F.x+.5>ox+.15&&F.x+.5<ox+o.w-.15});
    if(!on)die('water');else if(F.x<-.4||F.x>COLS-.6)die('water');else F.c=Math.round(F.x)}
   else if(ln.t==='road'){const hit=ln.o.some(o=>{const ox=objX(o,ln);return F.x+.78>ox&&F.x+.22<ox+o.w});if(hit)die('car')}}
  // draw
  for(let r=0;r<ROWS;r++){const y=r*cs,l=L[r];
   if(l.t==='goal'){x.fillStyle='#4dabf7';x.fillRect(0,y,W,cs);for(let k=0;k<COLS;k+=2){x.fillStyle='#40c057';x.beginPath();x.ellipse((k+.5)*cs,y+cs/2,cs*.4,cs*.3,0,0,7);x.fill();x.fillStyle='#f783ac';x.beginPath();x.arc((k+.5)*cs+cs*.15,y+cs*.4,cs*.08,0,7);x.fill()}}
   else if(l.t==='grass'){x.fillStyle=r%2?'#8ce99a':'#69db7c';x.fillRect(0,y,W,cs);x.fillStyle='#51cf66';for(let k=0;k<COLS;k++){x.fillRect(k*cs+cs*.2,y+cs*.3,2,cs*.2);x.fillRect(k*cs+cs*.6,y+cs*.6,2,cs*.2)}}
   else if(l.t==='road'){x.fillStyle='#495057';x.fillRect(0,y,W,cs);if(r!==11){x.fillStyle='#ffffffaa';for(let k=0;k<COLS;k++)x.fillRect(k*cs+cs*.2,y+cs-2,cs*.5,3)}
    l.o.forEach(o=>{const X=objX(o,l)*cs,w=o.w*cs;rr(X+3,y+cs*.14,w-6,cs*.72,8,o.col);x.fillStyle='#e7f5ff';const wx=l.dir>0?X+w-cs*.42:X+cs*.12;x.fillRect(wx,y+cs*.24,cs*.3,cs*.52);x.fillStyle='#212529';[[.12,.08],[.12,.86],[o.w-.3,.08],[o.w-.3,.86]].forEach(([a,b])=>x.fillRect(X+a*cs,y+b*cs-2,cs*.18,5))})}
   else{x.fillStyle=r%2?'#339af0':'#4dabf7';x.fillRect(0,y,W,cs);x.strokeStyle='#a5d8ff';x.lineWidth=2;for(let k=0;k<COLS;k++){x.beginPath();x.arc(k*cs+cs*.5+((l.off*cs)%cs),y+cs*.6,cs*.15,Math.PI*1.1,Math.PI*1.9);x.stroke()}
    l.o.forEach(o=>{const X=objX(o,l)*cs,w=o.w*cs;rr(X+2,y+cs*.16,w-4,cs*.68,cs*.3,'#a0522d');x.fillStyle='#c47a3d';x.fillRect(X+cs*.3,y+cs*.3,w-cs*.6,cs*.08);x.fillRect(X+cs*.5,y+cs*.58,w-cs,cs*.08);x.fillStyle='#e0a96d';x.beginPath();x.ellipse(X+cs*.25,y+cs*.5,cs*.12,cs*.25,0,0,7);x.fill()})}}
  if(splash){splash.t-=dt;x.globalAlpha=Math.max(0,splash.t/.6);x.fillStyle=splash.why==='water'?'#fff':'#ffd43b';x.beginPath();x.arc((splash.x+.5)*cs,(splash.r+.5)*cs,cs*(.8-splash.t*.6),0,7);x.fill();x.globalAlpha=1;if(splash.t<=0)splash=null}
  if(!dead&&!(inv>0&&Math.floor(inv*10)%2)){const k=F.hop,px=(F.x+(F.fx-F.x)*k*0)+.5,ry=F.r+(F.fy-F.r)*k;drawFrog(px*cs,(ry+.5)*cs-Math.sin(k*Math.PI)*cs*.25,cs*(1+Math.sin(k*Math.PI)*.15),F.face)}
 });
}


/* --- 관찰력: 마작 짝맞추기 --- */
function mahjong(c){
 const CN='一二三四五六七八九';
 const DOTP={1:[[2,2]],2:[[2,1],[2,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[3,1],[1,3],[3,3]],5:[[1,1],[3,1],[2,2],[1,3],[3,3]],6:[[1,1],[3,1],[1,2],[3,2],[1,3],[3,3]],7:[[1,.7],[2,1.1],[3,1.5],[1,2.4],[3,2.4],[1,3.3],[3,3.3]],8:[[1,.8],[3,.8],[1,1.6],[3,1.6],[1,2.4],[3,2.4],[1,3.2],[3,3.2]],9:[[1,1],[2,1],[3,1],[1,2],[2,2],[3,2],[1,3],[2,3],[3,3]]};
 const FACES=[];
 for(let n=1;n<=9;n++)FACES.push({k:'d'+n,h:`<svg viewBox="0 0 40 48">${DOTP[n].map(([a,b],i)=>`<circle cx="${a*10}" cy="${b*11+2}" r="${n>6?4.3:5.2}" fill="none" stroke="${['#1971c2','#2b8a3e','#c92a2a'][(i+n)%3]}" stroke-width="3"/><circle cx="${a*10}" cy="${b*11+2}" r="1.6" fill="${['#1971c2','#2b8a3e','#c92a2a'][(i+n)%3]}"/>`).join('')}</svg>`});
 for(let n=2;n<=9;n++)FACES.push({k:'b'+n,h:`<svg viewBox="0 0 40 48">${Array.from({length:n},(_,i)=>{const cols=n<=3?n:n<=6?Math.ceil(n/2):3,rows=Math.ceil(n/cols),r=Math.floor(i/cols),q=i%cols,w=34/cols;return`<rect x="${3+q*w+w/2-3}" y="${4+r*(40/rows)}" width="6" height="${40/rows-4}" rx="3" fill="${i===0&&n>4?'#c92a2a':'#2b8a3e'}"/><rect x="${3+q*w+w/2-3}" y="${4+r*(40/rows)+(40/rows-4)/2-1}" width="6" height="2" fill="#fff8"/>`}).join('')}</svg>`});
 for(let n=1;n<=9;n++)FACES.push({k:'c'+n,h:`<span class="mjc"><b style="color:#1c3faa">${CN[n-1]}</b><b style="color:#c92a2a">萬</b></span>`});
 [['中','#c92a2a'],['發','#2b8a3e'],['東','#1b2240'],['南','#1b2240'],['西','#1b2240'],['北','#1b2240']].forEach(([t,col])=>FACES.push({k:'h'+t,h:`<span class="mjh" style="color:${col}">${t}</span>`}));
 ['🎸','🌸','🍀','⭐','🍎','🐞','🌙','🍄'].forEach(e=>FACES.push({k:'e'+e,h:`<span class="mje emo">${e}</span>`}));
 const LAYOUTS=[
  [[6,4,0,0],[3,2,1,1]],
  [[6,5,0,0],[4,3,1,1],[2,1,3,3]],
  [[6,6,0,0],[5,4,1,1],[3,2,3,3],[1,1,5,5]],
  [[6,6,0,0],[5,5,1,1],[4,3,2,2],[2,2,4,4]]];
 let lvl=0,T=[],tray=[],hist=[],uses,combo=0,mult=1,lastMatch=0,stuck=false;
 const covered=(t,list=T)=>list.some(o=>!o.gone&&o!==t&&o.z>t.z&&Math.abs(o.x-t.x)<2&&Math.abs(o.y-t.y)<2);
 const make=()=>{
  const spec=LAYOUTS[Math.min(lvl,LAYOUTS.length-1)];let pos=[];
  spec.forEach(([cw,rh,ox,oy],z)=>{for(let i=0;i<cw;i++)for(let j=0;j<rh;j++)pos.push({x:ox+i*2,y:oy+j*2,z})});
  if(pos.length%2)pos.pop();
  // 거꾸로 두 개씩 떼어 내며 같은 그림을 붙여서 항상 풀 수 있게 만들기
  let ok=false;for(let tries=0;tries<200&&!ok;tries++){
   const live=pos.map(p=>({...p,gone:false,f:null}));const faces=shuffle(FACES).slice(0,Math.min(FACES.length,Math.ceil(live.length/2/ (lvl<1?1.4:1.15))));ok=true;
   for(let k=0;k<live.length/2;k++){const free=live.filter(t=>!t.gone&&!covered(t,live));if(free.length<2){ok=false;break}
    const [a,b]=shuffle(free).slice(0,2),f=faces[k%faces.length];a.f=f;b.f=f;a.gone=b.gone=true}
   if(ok)T=live.map((t,i)=>({...t,gone:false,id:i}))}
  tray=[];hist=[];uses={undo:3,hint:3,shuf:2};combo=0;mult=1;stuck=false;draw()};
 const draw=()=>{
  c.prompt(`같은 그림 두 개를 위 칸에 모으세요 <small style="font-size:15px;color:var(--sub)">· ${lvl+1}단계</small>`);
  c.el.innerHTML=`<div class="mjtop"><div class="mjtray">${[0,1,2,3].map(i=>`<i>${tray[i]?`<span class="mjt">${tray[i].f.h}</span>`:''}</i>`).join('')}</div>
   <div class="mjcombo"><div class="mjbar"><i style="width:${combo/7*100}%"></i><span>${combo}/7</span></div><b>${mult.toFixed(1)}x</b></div></div>
   <div class="mjboard" id="mb"></div>
   <div class="mjbtns"><button class="btn" id="mu">↩<small>되돌리기 ${uses.undo}</small></button><button class="btn" id="mh">🔍<small>힌트 ${uses.hint}</small></button><button class="btn" id="ms">🔀<small>섞기 ${uses.shuf}</small></button></div>`;
  const mb=c.el.querySelector('#mb'),live=T.filter(t=>!t.gone);
  const maxX=Math.max(...T.map(t=>t.x))+2,maxY=Math.max(...T.map(t=>t.y))+2,W=mb.clientWidth,unit=Math.min(W/(maxX+.6),(Math.min(460,innerHeight*.55))/(maxY*1.2+.6)),tw=unit*2,th=unit*2.4,dz=Math.max(3,unit*.18);
  mb.style.height=(maxY*unit*1.2+th*.2+dz*4)+'px';mb.style.setProperty('--sw',tw*.78+'px');mb.style.setProperty('--sh',th*.78+'px');
  mb.innerHTML=live.sort((a,b)=>a.z-b.z||a.y-b.y||a.x-b.x).map(t=>{const cov=covered(t);return`<button class="cell mjtile${cov?' cov':''}" data-id="${t.id}" style="left:${t.x*unit+(4-t.z)*0+dz*(3-t.z)}px;top:${t.y*unit*1.2+dz*(3-t.z)}px;width:${tw}px;height:${th}px;z-index:${t.z*100+t.y*2+t.x}" aria-label="타일">${t.f.h}</button>`}).join('');
  mb.querySelectorAll('.mjtile').forEach(b=>b.onclick=()=>pickTile(+b.dataset.id,b));
  c.el.querySelector('#mu').onclick=undo;c.el.querySelector('#mh').onclick=()=>{if(uses.hint<=0){hToast('힌트를 다 썼어요');return}if(hint())uses.hint--;draw();hint()};
  c.el.querySelector('#ms').onclick=()=>{if(uses.shuf<=0){hToast('섞기를 다 썼어요');return}uses.shuf--;const lv=T.filter(t=>!t.gone),fs=shuffle(lv.map(t=>t.f));lv.forEach((t,i)=>t.f=fs[i]);draw()};
  ['mu','mh','ms'].forEach((id,i)=>{const k=['undo','hint','shuf'][i];if(uses[k]<=0)c.el.querySelector('#'+id).disabled=true})};
 const hint=()=>{const free=T.filter(t=>!t.gone&&!covered(t));let pick=null;
  for(const tr of tray){pick=free.find(t=>t.f.k===tr.f.k);if(pick)break}
  if(!pick){for(const a of free){const b=free.find(x=>x!==a&&x.f.k===a.f.k);if(b){pick=a;const e=c.el.querySelector(`.mjtile[data-id="${b.id}"]`);if(e){e.classList.remove('hintg');void e.offsetWidth;e.classList.add('hintg')}break}}}
  if(!pick)return false;const e=c.el.querySelector(`.mjtile[data-id="${pick.id}"]`);if(e){e.classList.remove('hintg');void e.offsetWidth;e.classList.add('hintg')}return true};
 c.setHint(()=>{const r=hint();return r});
 const pickTile=(id,el)=>{if(stuck)return;const t=T[id];if(t.gone)return;if(covered(t)){el.classList.remove('no');void el.offsetWidth;el.classList.add('no');return}
  if(tray.length>=4)return;
  t.gone=true;const same=tray.findIndex(x=>x.f.k===t.f.k);
  if(same>=0){const pair=tray.splice(same,1)[0];hist=hist.filter(h=>h!==pair);
   const now=Date.now();combo=now-lastMatch<6000?combo+1:1;lastMatch=now;if(combo>=7){combo=0;mult=Math.min(3,mult+.5);hToast(`콤보! ${mult.toFixed(1)}배`)}
   c.ok(Math.round(mult));
   if(T.every(x=>x.gone)){c.ok(5+lvl*2);draw();c.prompt('모두 맞췄어요!');lvl++;c.later(make,1200);return}}
  else{tray.push(t);hist.push(t)}
  draw();
  if(tray.length>=4){stuck=true;
   if(uses.undo>0){c.prompt('칸이 가득 찼어요! ↩ 되돌리기로 살려 보세요')}
   else{c.prompt('칸이 가득 찼어요!');c.later(c.end,1400)}}};
 const undo=()=>{if(uses.undo<=0||!hist.length){hToast(hist.length?'되돌리기를 다 썼어요':'되돌릴 타일이 없어요');return}
  const t=hist.pop();tray.splice(tray.indexOf(t),1);t.gone=false;uses.undo--;stuck=false;draw()};
 make();
}

home();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
