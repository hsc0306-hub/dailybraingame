<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3d5afe">
<meta name="description" content="하루 몇 분, 60가지 두뇌 게임으로 집중력·사고력·관찰력·기억력·계산력·언어력을 깨워요.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="매일 뇌운동">
<title>매일 뇌운동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 하루 몇 분, 가볍고 깔끔한 두뇌 트레이닝 앱
   IDEA: 카테고리 색으로 구분되는 게임 카드와 '무대'처럼 꽉 찬 게임판
   PICTURE: 홈은 노란 마스코트가 있는 파란 히어로, 게임은 색 틴트 무대 위 하얀 말판
   COLOUR and TYPE: 인디고 블루 기본, 카테고리 5색 / Gothic A1 800·900
   LAYOUT: 히어로 → 칩 필터 → 2열 카드, 게임은 상단 바 · 타이머 바 · 안내 · 무대 */
:root{color-scheme:light dark;--bg:light-dark(#f1f4fb,#10131d);--card:light-dark(#ffffff,#1b2030);--ink:light-dark(#151a2e,#eef1fa);--sub:light-dark(#6b7390,#9aa3bf);--line:light-dark(#e6eaf4,#2a3044);--pri:#3d5afe;--pri2:#2f45d8;--ok:#12b886;--no:#fa5252;--piece:#ffffff;--pink:#1b2240;--sh:0 1px 2px rgba(20,30,80,.06),0 6px 18px rgba(20,30,80,.07)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Gothic A1",system-ui,sans-serif;overflow-x:clip;min-height:100vh;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:0 0 40px}
.pad{padding:0 16px}
/* hero */
.hero{background:linear-gradient(160deg,#4f6bff,#3346e0 70%);color:#fff;padding:20px 18px 22px;border-radius:0 0 30px 30px;position:relative;overflow:hidden;margin-bottom:18px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff14}
.hero:before{width:240px;height:240px;right:-70px;top:-90px}.hero:after{width:150px;height:150px;left:-50px;bottom:-80px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative;z-index:1}
.brand{font-weight:900;font-size:22px;letter-spacing:-.03em}
.pts{display:flex;align-items:center;gap:6px;background:#ffffff26;border-radius:999px;padding:5px 12px 5px 5px;font-weight:800;white-space:nowrap}
.coin{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b8,#ffcc1f 55%,#e8a300);display:inline-grid;place-items:center;color:#9a6400;font-size:12px;font-weight:900;box-shadow:inset 0 -2px 0 #0002}
.hmain{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:8px;align-items:center;margin-top:16px;position:relative;z-index:1}
.hmain h1{font-size:clamp(26px,7.4vw,32px);line-height:1.15;margin:0 0 6px;font-weight:900;letter-spacing:-.04em;text-wrap:balance}
.hmain p{margin:0;opacity:.85;font-size:15px}
.mascot{width:116px;height:116px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.goal{background:#fff;color:var(--pink);border-radius:20px;padding:14px 16px;margin-top:16px;position:relative;z-index:1;display:grid;gap:10px}
.goal .gt{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.goal .gt span{color:#6b7390;font-weight:600;font-size:14px}
.bar{height:12px;background:#e9edfb;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc21a,#ff9f1a);border-radius:99px;transition:width .4s}
.goal .act{display:flex;gap:8px}
.cta{border:0;border-radius:16px;background:var(--pri);color:#fff;font-size:18px;font-weight:800;min-height:54px;padding:0 20px;cursor:pointer;box-shadow:0 4px 0 var(--pri2)}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
.cta.soft{background:#eef1ff;color:var(--pri);box-shadow:0 4px 0 #d6dcfb}
.goal .cta{flex:1;min-height:48px;font-size:16px}
/* speed */
.speed{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:18px;padding:10px 10px 10px 16px;box-shadow:var(--sh);margin-bottom:16px}
.speed b{font-weight:800;font-size:15px}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:0 12px;min-height:38px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px #0002}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 10px}
.sec h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em}
.sec span{color:var(--sub);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px;scrollbar-width:none}
.chips button{flex:none;display:flex;align-items:center;gap:5px;border:0;border-radius:999px;background:var(--card);padding:0 14px;min-height:40px;cursor:pointer;color:var(--sub);font-weight:700;font-size:14px;box-shadow:var(--sh)}
.chips button.on{background:var(--ink);color:var(--bg)}
.ic{width:16px;height:16px;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{border:0;background:var(--card);border-radius:22px;padding:8px;cursor:pointer;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.gcard:active{transform:scale(.97)}
.thumb{background:color-mix(in srgb,var(--cc) 13%,#fff);border-radius:16px;aspect-ratio:1.25;display:grid;place-items:center;overflow:hidden;color:#1b2240;font-weight:900;font-size:20px;text-align:center;line-height:1.15;position:relative}
.thumb>*{max-width:76%;max-height:80%}
.thumb svg{width:72%;height:auto;max-height:84%}
.meta{padding:2px 6px 6px}
.nm{font-weight:800;font-size:16px;line-height:1.3}
.tag{display:inline-flex;align-items:center;gap:4px;color:var(--cc);font-weight:800;font-size:13px}
.best{font-size:12px;color:var(--sub);float:right;margin-top:2px}
:focus-visible{outline:3px solid #ffb21a;outline-offset:3px}
/* intro */
.intro{margin:16px;background:var(--card);border-radius:28px;padding:12px 12px 18px;box-shadow:var(--sh);display:grid;gap:14px}
.intro .thumb{aspect-ratio:1.5;border-radius:20px;font-size:30px}
.intro .thumb svg{width:46%}
.intro .in{padding:0 8px;display:grid;gap:10px}
.intro h2{margin:0;font-size:30px;line-height:1.1;font-weight:900;letter-spacing:-.04em}
.how{background:var(--bg);border-radius:16px;padding:14px 16px;font-size:16px;line-height:1.6}
.facts{display:flex;gap:8px;flex-wrap:wrap}.facts span{background:var(--bg);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--sub);font-weight:600}
.two{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding:0 4px}
/* play */
.top{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:12px 14px 8px}
.iconb{width:44px;height:44px;border:0;border-radius:14px;background:var(--card);box-shadow:var(--sh);cursor:pointer;display:grid;place-items:center}
.ttl{text-align:center;font-weight:800;font-size:16px;line-height:1.2}.ttl small{display:block;color:var(--cc);font-size:12px}
.score{background:var(--ink);color:var(--bg);border-radius:14px;min-height:44px;padding:0 14px;display:grid;place-items:center;font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;min-width:64px;transition:transform .15s}
.score.bump{transform:scale(1.15)}
.tline{display:flex;align-items:center;gap:10px;padding:0 16px}
.tbar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--cc);border-radius:99px;transition:width .2s linear}
.tbar i.low{background:var(--no)}
.tsec{font-weight:900;font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.prompt{font-size:clamp(21px,5.8vw,26px);line-height:1.25;text-align:center;margin:14px 16px 12px;font-weight:900;letter-spacing:-.03em;text-wrap:balance;min-height:1.25em}
.stage{margin:0 12px;background:color-mix(in srgb,var(--cc) 11%,var(--card));border-radius:28px;padding:18px 14px;min-height:max(440px,calc(100svh - 220px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;overflow:hidden}
.float{position:absolute;left:50%;top:22%;font-weight:900;font-size:34px;pointer-events:none;animation:up .7s forwards;z-index:9}
@keyframes up{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
/* pieces */
.btn,.cell{border:0;cursor:pointer;padding:0}
.btn{border-radius:18px;background:var(--piece);color:#1b2240;min-height:64px;font-size:20px;font-weight:800;box-shadow:0 4px 0 #0000001a;padding:0 10px}
.btn:active,.cell:active{transform:translateY(3px)}
.btn:disabled{opacity:.5}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:400px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:400px}
.holes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:380px}
.hole{aspect-ratio:1;border-radius:24px;background:#a8d672 radial-gradient(ellipse 40% 15% at 50% 78%,#5b3a22 98%,transparent);overflow:hidden;position:relative;box-shadow:inset 0 -6px 0 #0000001a}
.hole>span{position:absolute;left:18%;right:18%;bottom:20%;height:70%;transform:translateY(110%);transition:transform .15s;display:block;clip-path:inset(-50% -50% 0 -50%)}
.hole.up>span{transform:translateY(0)}
.hole>span svg{width:100%;height:100%;display:block}
.hexes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:380px;padding:10px 0}
.hex{width:96px;aspect-ratio:1.1;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);color:#1b2240;font-weight:900;font-size:30px;transition:opacity .2s,transform .2s}
.hex.gone{opacity:0;transform:scale(.6);pointer-events:none}
.target{background:#fff;border-radius:20px;width:96px;height:96px;display:grid;place-items:center;font-size:54px;box-shadow:0 0 0 4px var(--cc),0 6px 0 #0000001a}
.field{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:100%;max-width:400px;background:#fff;padding:10px;border-radius:20px;box-shadow:0 4px 0 #0000001a}
.field .cell{background:transparent;font-size:clamp(26px,8vw,36px);aspect-ratio:1;border-radius:12px}
.field .cell.found{background:color-mix(in srgb,var(--cc) 25%,#fff)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:380px}
.card{aspect-ratio:.8;border-radius:14px;perspective:600px;position:relative;background:none}
.card>i{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;transition:transform .3s;font-style:normal}
.card .f{background:#fff;font-size:clamp(26px,8vw,40px);transform:rotateY(180deg);box-shadow:0 4px 0 #0000001a}
.card .b{background:var(--cc) radial-gradient(circle,#ffffff40 3px,transparent 4px) 0 0/14px 14px;box-shadow:0 4px 0 #0000002a}
.card.open .f{transform:rotateY(0)}.card.open .b{transform:rotateY(-180deg)}
.card.done{opacity:.3;pointer-events:none}
.handbox{background:#fff;border-radius:28px;width:min(240px,70vw);aspect-ratio:1;display:grid;place-items:center;box-shadow:0 6px 0 #0000001a}
.handbox svg{width:78%}
.chip{background:var(--cc);color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px}
.exprs{display:grid;gap:10px;width:100%;max-width:380px}
.expr{background:#fff;border-radius:22px;min-height:104px;font-weight:900;font-size:clamp(34px,10vw,46px);color:#1b2240;box-shadow:0 5px 0 #0000001a;font-variant-numeric:tabular-nums}
.eq{background:#ffffffaa;border-radius:999px;min-height:48px;font-size:16px;font-weight:800;color:#5b6380}
.colors{display:grid;gap:6px;width:100%;max-width:380px;aspect-ratio:1}
.colors .cell{border-radius:12%}
.tower{position:relative;width:100%;max-width:400px;height:420px;background:linear-gradient(#bcd3ff,#eef3ff);border-radius:22px;overflow:hidden;touch-action:manipulation;cursor:pointer}
.tower .lay,.tower .mv{position:absolute;height:34px;border-radius:6px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.16)}
.tower .ground{position:absolute;left:0;right:0;bottom:0;height:16px;background:#8bc56b}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;max-width:380px}
.nums span{background:#fff;border-radius:12px;font-weight:900;font-size:22px;text-align:center;padding:6px 0;box-shadow:0 3px 0 #0000001a;color:#1b2240}
.receipt{background:#fff;border-radius:18px;width:100%;max-width:340px;padding:12px 16px;box-shadow:0 4px 0 #0000001a;color:#1b2240}
.receipt div{display:flex;justify-content:space-between;gap:8px;font-size:17px;padding:5px 0;border-bottom:1px dashed #dde3f2}
.receipt div:last-child{border:0}.qty{font-style:normal;display:inline-block;min-width:3.6em;text-align:right;margin-left:6px;color:var(--cc);font-weight:900}.receipt b{font-weight:900;white-space:nowrap}
.calc{background:#2b3350;border-radius:22px;padding:12px;width:100%;max-width:340px}
.calc .scr{background:#eef2ff;border-radius:12px;text-align:right;font-weight:900;font-size:30px;padding:4px 14px;margin-bottom:10px;color:#1b2240;min-height:50px;font-variant-numeric:tabular-nums}
.calc .keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc .keys button{border:0;border-radius:12px;background:#414b6e;min-height:50px;font-weight:800;font-size:22px;cursor:pointer;color:#fff}
.calc .keys .ent{background:var(--cc)}
.shapebox{width:min(220px,62vw);aspect-ratio:1;background:#fff;border-radius:28px;display:grid;place-items:center;box-shadow:0 6px 0 #0000001a}
.shapebox svg{width:66%;height:66%}
.comb{display:grid;gap:4px;justify-items:center;padding:8px 0}
.comb>div{display:flex;gap:8px}
.comb .hex{width:92px;background:#fff;color:#fff;box-shadow:none}
.comb .hex.lit{background:var(--cc)}
.rpsbig{background:#fff;border-radius:28px;width:min(210px,60vw);aspect-ratio:1;display:grid;place-items:center;font-size:clamp(80px,26vw,110px);box-shadow:0 6px 0 #0000001a}
.rpsb{font-size:48px;min-height:96px}
.cone{display:flex;flex-direction:column-reverse;align-items:center;width:150px;min-height:270px}
.cone .c{width:96px;height:110px;background:repeating-linear-gradient(45deg,#e6a852 0 10px,#d49440 10px 12px);clip-path:polygon(0 0,100% 0,50% 100%)}
.cone .s{width:124px;height:58px;border-radius:60px 60px 30px 30px;margin-bottom:-18px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);animation:drop .25s}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.counter{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:10px;box-shadow:0 4px 0 #0000001a}
.flav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.flav button{border:0;border-radius:14px;min-height:58px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.machine{display:grid;justify-items:center}
.dome{width:190px;height:160px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff 0 8%,#ffffffaa 9%,#ffffff66 60%,#ffffffaa);border:4px solid #fff;position:relative;overflow:hidden}
.dome i{position:absolute;width:50px;height:50px;border-radius:50%;box-shadow:inset -6px -6px 0 rgba(0,0,0,.14),inset 6px 6px 0 rgba(255,255,255,.35)}
.lid{width:120px;height:24px;background:#f03e3e;border-radius:60px 60px 0 0;margin-bottom:-6px}
.base{width:110px;height:70px;background:#e03131;border-radius:8px;display:grid;place-items:center}.base i{width:40px;height:40px;border-radius:50%;background:#5a0b07;border:6px solid #ffd3d0}
.tray{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;min-height:60px;width:100%}
.ball{width:56px;height:56px;border-radius:50%;color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;box-shadow:inset -6px -7px 0 rgba(0,0,0,.18),inset 5px 5px 0 rgba(255,255,255,.3);text-shadow:0 1px 0 rgba(0,0,0,.25);animation:drop .3s}
.ballgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:320px;justify-items:center}
.ballgrid .ball{border:0;cursor:pointer;width:62px;height:62px}
.ballgrid .ball.used{opacity:.25;pointer-events:none}
.cvwrap{width:100%;max-width:400px;position:relative}
.cvwrap canvas{display:block;width:100%;height:420px;border-radius:22px;touch-action:none}
.hearts{position:absolute;right:10px;top:46px;font-weight:900;font-size:16px;color:#fa5252;pointer-events:none;background:#fffffff0;border-radius:999px;padding:3px 10px;box-shadow:0 2px 6px #0002;z-index:2}
.ctrl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:400px;user-select:none;-webkit-user-select:none}
.ctrl .btn{min-height:72px;font-size:20px;touch-action:none}
.ctrl .btn.on{transform:translateY(3px);background:#eef1ff}
/* result */
.res{margin:16px;background:var(--card);border-radius:28px;padding:26px 20px 20px;text-align:center;display:grid;gap:8px;justify-items:center;box-shadow:var(--sh)}
.res .burst{width:150px;height:150px}
.res .big{font-weight:900;font-size:clamp(60px,18vw,84px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.res .big small{font-size:.4em}
.res p{margin:0;color:var(--sub)}
.newb{background:#fff3cd;color:#a86a00;border-radius:999px;padding:4px 14px;font-weight:800;font-size:14px}
.got{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:16px;padding:12px 16px;width:100%;justify-content:center;font-weight:800;margin-top:6px}
.res .two{width:100%;padding:0;margin-top:8px}

/* ---- 3D look ---- */
.cvwrap.three{height:420px;border-radius:22px;overflow:hidden}
.cvwrap.three.tall{height:min(460px,calc(100svh - 260px));min-height:380px}
.cvwrap.three canvas{display:block;width:100%!important;height:100%!important}
.sky{background:linear-gradient(#a9c8ff,#e9f1ff)}.lav{background:linear-gradient(#d9e0ff,#f3f5ff)}.meadow{background:radial-gradient(ellipse at 50% 0%,#d8f5ff,#b6e3ff)}
.combo{position:absolute;left:0;right:0;top:14px;text-align:center;font-weight:900;font-size:22px;color:#fff;text-shadow:0 2px 0 #3d5afe,0 4px 10px #0003;pointer-events:none;transition:opacity .2s;z-index:2}
.combo.pop{animation:cpop .5s}
@keyframes cpop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.btn{background:linear-gradient(#ffffff,#eef2fb);box-shadow:0 6px 0 #c6cfe6,0 12px 18px rgba(30,40,90,.16),inset 0 2px 0 #fff}
.btn:active,.ctrl .btn.on{transform:translateY(5px);box-shadow:0 1px 0 #c6cfe6,0 4px 8px rgba(30,40,90,.12)}
.expr,.target,.handbox,.shapebox,.rpsbig,.receipt,.field,.counter,.nums span{background:linear-gradient(#ffffff,#f3f6fd);box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14),inset 0 2px 0 #fff}
.target{box-shadow:0 0 0 4px var(--cc),0 8px 0 color-mix(in srgb,var(--cc) 60%,#000),0 16px 22px rgba(30,40,90,.18)}
.expr:active{transform:translateY(4px);box-shadow:0 3px 0 #cdd5ea}
.hexes,.comb{filter:drop-shadow(0 6px 0 rgba(0,0,0,.18)) drop-shadow(0 12px 10px rgba(30,40,90,.15))}
.hex{background-image:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0) 42%,rgba(0,0,0,.14))}
.comb .hex{background-color:#fff}.comb .hex.lit{background-color:var(--cc)}
.colors .cell{background-image:none;box-shadow:none}
.card .f{background:linear-gradient(#fff,#f1f4fb);box-shadow:0 6px 0 #cdd5ea,0 12px 16px rgba(30,40,90,.14)}

.field .cell,.card .f,.rpsbig,.rpsb{filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
.calc{box-shadow:0 8px 0 #171c30,0 18px 26px rgba(20,25,50,.3)}
.calc .keys button{background:linear-gradient(#4c5780,#3c4568);box-shadow:0 4px 0 #262d47,inset 0 1px 0 #ffffff30}
.calc .keys .ent{background:var(--cc);box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 55%,#000)}
.calc .keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #262d47}
.flav button{background-image:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 45%,rgba(0,0,0,.1));box-shadow:0 5px 0 rgba(0,0,0,.18)}
.cone .s{background-image:radial-gradient(ellipse at 35% 30%,rgba(255,255,255,.6),rgba(255,255,255,0) 40%),linear-gradient(rgba(0,0,0,0) 60%,rgba(0,0,0,.15));box-shadow:0 6px 8px rgba(0,0,0,.15)}
.cone .c{filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.ball,.dome i{background-image:radial-gradient(circle at 32% 28%,rgba(255,255,255,.75) 0 10%,rgba(255,255,255,0) 32%),radial-gradient(circle at 50% 115%,rgba(0,0,0,.35),rgba(0,0,0,0) 60%);box-shadow:0 5px 8px rgba(0,0,0,.22)}
.machine{filter:drop-shadow(0 10px 10px rgba(0,0,0,.18))}
.lid,.base{background-image:linear-gradient(rgba(255,255,255,.3),rgba(0,0,0,.12))}
.shapebox svg,.handbox svg,.thumb svg{filter:drop-shadow(0 4px 0 rgba(0,0,0,.12)) drop-shadow(0 8px 8px rgba(30,40,90,.12))}
.tower .lay,.tower .mv{background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,.12))}
/* ---- 능력치 ---- */
.abil{background:var(--card);border-radius:24px;padding:16px 16px 14px;box-shadow:var(--sh);margin-bottom:16px}
.ah{display:flex;justify-content:space-between;align-items:baseline}
.ah h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em}
.tot{color:var(--sub);font-weight:700}.tot b{color:var(--pri);font-size:26px;font-weight:900;margin-left:4px}
.radar{width:100%;max-width:360px;display:block;margin:4px auto 0;overflow:visible}
.radar .r1{fill:color-mix(in srgb,var(--pri) 5%,var(--card));stroke:var(--line);stroke-width:1.5}
.radar .r2{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.radar .ax{stroke:var(--line);stroke-width:1.5}
.radar .cur{fill:rgba(61,90,254,.22);stroke:var(--pri);stroke-width:3;stroke-linejoin:round}
.radar .prev{fill:none;stroke:var(--sub);stroke-width:2;stroke-dasharray:5 5;opacity:.7}
.radar .grow{transform-origin:160px 152px;animation:rg .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes rg{from{transform:scale(.2);opacity:0}}
.radar .lb{font-size:15px;font-weight:800}.radar .lv{fill:var(--ink);font-size:17px;font-weight:900}
.radar .up{fill:#12b886;font-size:12px}.radar .dn{fill:#fa5252;font-size:12px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.sw div{background:var(--bg);border-radius:14px;padding:10px 14px}.sw small{display:block;color:var(--sub);font-size:13px}.sw b{font-size:18px;font-weight:900}
.anote{margin:10px 2px 0;color:var(--sub);font-size:13px;line-height:1.5;text-align:center}
.rbox{width:100%;background:var(--bg);border-radius:18px;padding:14px 10px 6px;margin-top:4px}
.rbox b{font-weight:800}.rbox em{font-style:normal;font-weight:900;font-size:20px}
/* ---- 한글타자 ---- */
.tfield{position:relative;width:100%;max-width:420px;height:min(360px,calc(100svh - 330px));min-height:260px;border-radius:22px;overflow:hidden;background:linear-gradient(#bfe3ff,#eef8ff 75%);box-shadow:inset 0 -26px 0 #8fd16a,inset 0 -32px 0 #6fb84d}
.tfield .w{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#fff,#f1f4fb);color:#1b2240;font-weight:900;font-size:20px;padding:6px 14px;border-radius:999px;box-shadow:0 4px 0 #cdd5ea,0 8px 12px rgba(30,40,90,.15);transition:background .15s}
.tfield .w.hit{background:#e64980;color:#fff;box-shadow:0 4px 0 #a61e4d}
.tfield .w b{color:#e64980}.tfield .w.hit b{color:#fff}
.tfield .w.pop{animation:wpop .35s forwards}
.tfield .w.miss{background:#fa5252;color:#fff;animation:wmiss .5s forwards}
@keyframes wpop{to{transform:translateX(-50%) scale(1.5);opacity:0}}
@keyframes wmiss{to{transform:translateX(-50%) translateY(20px);opacity:0}}
.tfield .hearts{top:auto;bottom:4px;right:auto;left:10px}
.tbox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;max-width:420px}
.tbox input{font:inherit;font-size:20px;font-weight:800;border:3px solid #e64980;border-radius:16px;padding:0 16px;min-height:56px;background:#fff;color:#1b2240;outline:none}
.tbox input:focus{box-shadow:0 0 0 4px #e6498033}
.tbox .btn{min-height:56px;padding:0 18px;font-size:18px}
/* ---- 물약 ---- */
.tubes{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;max-width:400px;padding-top:18px}
.tube{position:relative;width:54px;height:178px;background:rgba(255,255,255,.45);border:3px solid #fff;border-radius:10px 10px 28px 28px;box-shadow:0 8px 14px rgba(30,40,90,.15),inset 6px 0 0 rgba(255,255,255,.5);transition:transform .15s;overflow:visible}
.tube .cork{position:absolute;left:8px;right:8px;top:-12px;height:12px;border-radius:4px 4px 0 0;background:linear-gradient(#e0a46a,#b9793f)}
.tube .liq{position:absolute;inset:auto 4px 4px 4px;display:flex;flex-direction:column-reverse;border-radius:0 0 22px 22px;overflow:hidden}
.tube .liq i{display:block;height:38px;background-image:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,0) 40%,rgba(0,0,0,.12));box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.tube.sel{transform:translateY(-16px);border-color:var(--cc);box-shadow:0 16px 18px rgba(30,40,90,.2),0 0 0 3px #fff}
.tube.full{border-color:#ffe066}
.tube.no{animation:shk .3s}
/* ---- 블록 ---- */
.bboard{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;width:100%;max-width:360px;aspect-ratio:1;background:#2b3350;padding:6px;border-radius:16px;box-shadow:0 8px 0 #171c30,0 16px 24px rgba(20,25,50,.25);touch-action:manipulation}
.bc{background:#3c4568;border-radius:5px;position:relative}
.bc.on{background-image:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0) 45%,rgba(0,0,0,.15));box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.bc.pv{background-color:var(--pc)!important;opacity:.55}
.bc.px{background:#fa525266}
.bc.ln{background-color:var(--lc)!important;opacity:1!important;box-shadow:0 0 0 2px #fff,0 0 12px 2px var(--lc);animation:lnp .6s ease-in-out infinite alternate;z-index:1}
@keyframes lnp{to{filter:brightness(1.35)}}
.bc.clr{animation:clr .26s forwards}
@keyframes clr{to{transform:scale(.2);opacity:0}}
.btray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:360px}
.slot{height:110px;border-radius:16px;background:#ffffffaa;display:grid;place-items:center;touch-action:none;cursor:grab}
.slot.sel{box-shadow:0 0 0 3px var(--cc)}.slot.lift .pc{opacity:.25}.slot.dead .pc{opacity:.3;filter:grayscale(1)}
.pc{position:relative}.pc i{position:absolute;border-radius:4px;background-image:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0) 45%,rgba(0,0,0,.15));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.bhint{margin:0;color:var(--sub);font-size:14px}
/* ---- 픽셀 ---- */
.pxwrap{width:100%;max-width:360px;background:#fff;border-radius:20px;padding:12px;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14)}
.pxg{display:grid;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none}
.pxg i{aspect-ratio:1;border-radius:3px;display:block}
.pxg i.p{box-shadow:inset 0 -2px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.3);transition:opacity .15s}
.pxg i.p.dim{opacity:.45}
.pxg i.gone{background:repeating-conic-gradient(#f1f3f5 0 25%,#fff 0 50%) 0 0/8px 8px;animation:pgone .25s}
.pxg i.wrong{animation:shk .3s}
@keyframes pgone{from{transform:scale(1.3)}}
.pal{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:380px}
.sw{border:0;background:#fff;border-radius:16px;padding:6px 10px 6px 6px;display:flex;align-items:center;gap:6px;min-height:52px;cursor:pointer;box-shadow:0 4px 0 #cdd5ea;font-weight:900;color:#1b2240}
.sw i{width:38px;height:38px;border-radius:10px;background:var(--sw);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35)}
.sw.on{box-shadow:0 0 0 3px var(--cc),0 4px 0 #cdd5ea;transform:translateY(-2px)}
/* ---- 초성 ---- */
.chos{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chos span{width:76px;height:88px;border-radius:20px;background:var(--cc);color:#fff;display:grid;place-items:center;font-size:46px;font-weight:900;background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 45%,rgba(0,0,0,.12));box-shadow:0 7px 0 color-mix(in srgb,var(--cc) 60%,#000),0 14px 18px rgba(30,40,90,.18);animation:drop .3s backwards}
.chos span:nth-child(2){animation-delay:.06s}.chos span:nth-child(3){animation-delay:.12s}.chos span:nth-child(4){animation-delay:.18s}
.btn.right{background:#12b886;color:#fff;box-shadow:0 2px 0 #087f5b}.btn.wrongb{background:#ffe3e3;color:#c92a2a}
/* ---- 영어낱말찾기 ---- */
.wlist{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:400px}
.wlist span{background:#fff;border-radius:12px;padding:5px 10px;font-size:14px;color:#5b6380;box-shadow:0 3px 0 #cdd5ea;display:flex;gap:6px;align-items:baseline}
.wlist b{color:#1b2240;font-weight:900;letter-spacing:.05em;font-size:13px}
.wlist span.ok{background:var(--wc)}.wlist span.ok b{text-decoration:line-through}
.wgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;width:100%;max-width:360px;background:#fff;padding:8px;border-radius:18px;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14);touch-action:none;user-select:none;-webkit-user-select:none}
.wgrid i{font-style:normal;aspect-ratio:1;display:grid;place-items:center;font-weight:900;font-size:min(var(--wf,22px),6.4vw);color:#1b2240;border-radius:10px;background:#f1f4fb}
.wgrid i.fd{background:var(--wc)}
.wgrid i.sel{background:var(--cc);color:#fff;transform:scale(1.06)}
/* ---- 국기 ---- */
.flagbig{font-size:clamp(120px,40vw,170px);line-height:1.1;background:linear-gradient(#fff,#f3f6fd);border-radius:28px;padding:6px 26px;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14);animation:drop .3s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fopt{font-size:18px;line-height:1.25}
.fname{font-size:clamp(30px,9vw,40px);font-weight:900;background:linear-gradient(#fff,#f3f6fd);border-radius:24px;padding:18px 28px;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14);color:#1b2240;text-align:center;letter-spacing:-.03em}
.fflag{font-size:68px;min-height:104px;line-height:1;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.fflag small{font-size:13px;font-family:"Gothic A1",sans-serif;font-weight:800}
/* ---- 수도 ---- */
.capq{display:grid;justify-items:center;gap:4px;background:linear-gradient(#fff,#f3f6fd);border-radius:28px;padding:18px 30px 20px;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14);color:#1b2240;min-width:220px;text-align:center;animation:drop .3s}
.capq b{font-size:clamp(28px,8.5vw,38px);font-weight:900;letter-spacing:-.03em;line-height:1.15}
.capq small{font-size:15px;font-weight:800;color:#7950f2}
.cfl{font-size:76px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.cfl.s{font-size:26px;margin-right:6px;vertical-align:-3px}
/* ---- 그림퍼즐 ---- */
.pzhead{display:flex;align-items:center;gap:12px;width:100%;max-width:380px;background:#ffffffcc;border-radius:18px;padding:8px 12px 8px 8px}
.pzthumb{width:72px;height:72px;border-radius:12px;background-size:cover;flex:none;box-shadow:0 3px 0 #0002}
.pzhead b{display:block;font-weight:900;font-size:18px;color:#1b2240}.pzhead small{color:#5b6380;font-size:13px;line-height:1.35}
.pzboard{display:grid;gap:3px;width:100%;max-width:380px;aspect-ratio:1;background:#fff;padding:6px;border-radius:18px;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14);touch-action:none;user-select:none;-webkit-user-select:none;transition:gap .4s,padding .4s}
.pt{aspect-ratio:1;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s,box-shadow .12s}
.pt.ok{border-radius:2px}
.pt.sel,.pt.lift{transform:scale(.9);box-shadow:0 0 0 3px var(--cc),0 6px 12px rgba(0,0,0,.25);z-index:2}
.pt.over{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--cc)}
.pt.sw{animation:psw .25s}
@keyframes psw{from{transform:scale(.8)}}
.pzboard.done{gap:0;padding:0;overflow:hidden}.pzboard.done .pt{border-radius:0;box-shadow:none}
/* ---- 숨은그림찾기 ---- */
.hlist{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:400px}
.hlist span{background:#fff;border-radius:999px;padding:3px 12px 3px 6px;font-size:14px;font-weight:800;color:#1b2240;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 #cdd5ea}
.hlist em{font-style:normal;font-size:22px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.hlist span.ok{background:#12b886;color:#fff;box-shadow:0 3px 0 #087f5b;text-decoration:line-through}
.hfield{position:relative;width:100%;max-width:400px;height:min(430px,calc(100svh - 300px));min-height:340px;border-radius:20px;overflow:hidden;background-size:cover;background-position:center;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14)}
.hfield:before{content:"";position:absolute;inset:0;background:#ffffff38;pointer-events:none}
.hi{position:absolute;line-height:1;cursor:pointer;user-select:none;-webkit-user-select:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.hi.tg:after{content:"";position:absolute;inset:-10px}
.hi.found{z-index:3;animation:hfound .4s forwards}
.hi.found:before{content:"";position:absolute;inset:-9px;border:4px solid #f59f00;border-radius:50%;box-shadow:0 0 0 2px #fff}
@keyframes hfound{50%{scale:1.6}100%{scale:1.25}}
.hi.nope{animation:hnope .35s}
@keyframes hnope{25%{translate:-5px 0}75%{translate:5px 0}}
.hi.glow{z-index:3;animation:hglow 1.6s}
@keyframes hglow{0%,100%{filter:none}20%,60%{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px #f59f00);scale:1.5}40%,80%{scale:1}}
.hint{min-height:48px;font-size:16px;padding:0 18px}.hint small{color:#fa5252;margin-left:4px}
/* ---- 계산력 추가 ---- */
.eqn{display:flex;align-items:center;gap:8px;background:linear-gradient(#fff,#f3f6fd);border-radius:24px;padding:18px 20px;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14);font-weight:900;font-size:clamp(32px,10vw,46px);color:#1b2240;font-variant-numeric:tabular-nums}
.eqn .op{color:var(--cc)}.eqn .q{min-width:1.4em;text-align:center;background:var(--cc);color:#fff;border-radius:14px;padding:0 10px;box-shadow:0 4px 0 color-mix(in srgb,var(--cc) 60%,#000)}
.target3{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:10px 18px;box-shadow:0 5px 0 #cdd5ea;color:#1b2240}
.target3 small{font-weight:800;color:#5b6380}.target3 b{font-size:40px;font-weight:900;color:var(--cc);line-height:1}.target3 span{font-weight:800;color:#5b6380}.target3 em{font-style:normal;font-weight:900;font-size:22px;color:#1b2240}.target3 em.over{color:#fa5252}
.stiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:340px}
.st{aspect-ratio:1;border-radius:18px;font-size:32px;font-weight:900;color:#1b2240;background:hsl(var(--h) 90% 88%);background-image:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 45%,rgba(0,0,0,.06));box-shadow:0 5px 0 hsl(var(--h) 40% 70%)}
.st.on{background:var(--cc);color:#fff;transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--cc) 60%,#000)}
.bill,.coin2,.coin{font-weight:900;color:#1b2240;display:inline-grid;place-items:center}
.bill{min-width:74px;height:40px;padding:0 8px;border-radius:6px;background:var(--mc);font-size:14px;background-image:linear-gradient(90deg,rgba(255,255,255,.35) 0 18%,rgba(255,255,255,0) 18% 82%,rgba(255,255,255,.35) 82%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 3px 4px rgba(0,0,0,.18)}
.mbtns .coin,.tray2 .coin,.cfield .coin{width:46px;height:46px;border-radius:50%;background:var(--mc);font-size:13px;background-image:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(255,255,255,0) 45%);box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 3px 4px rgba(0,0,0,.2)}
.tray2{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:center;min-height:52px;width:100%;max-width:380px;background:#ffffffaa;border-radius:16px;padding:6px}
.tray2 .bill{min-width:52px;height:30px;font-size:11px}.tray2 .coin{width:32px;height:32px;font-size:10px}.tray2 i{color:#5b6380;font-size:14px}
.psum{font-weight:800;color:#5b6380}.psum b{color:#1b2240;font-size:22px;font-weight:900}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:380px}.mb{background:none;border-radius:8px}
.chainbox{display:grid;justify-items:center;gap:14px}
.cstep{min-width:170px;height:130px;border-radius:28px;background:linear-gradient(#fff,#f3f6fd);display:grid;place-items:center;font-size:58px;font-weight:900;color:#1b2240;box-shadow:0 7px 0 #cdd5ea,0 16px 24px rgba(30,40,90,.14);padding:0 24px}
.cstep.q{color:var(--cc)}.cstep.pop{animation:drop .3s}
.cdots{display:flex;gap:8px}.cdots i{width:14px;height:14px;border-radius:50%;background:#fff}.cdots i.on{background:var(--cc)}
.clockbox{display:grid;justify-items:center;gap:8px}.clockbox span{font-weight:800;color:#5b6380}
.clock{width:min(230px,62vw);filter:drop-shadow(0 7px 0 #cdd5ea) drop-shadow(0 14px 14px rgba(30,40,90,.15))}
.cfield{position:relative;width:100%;max-width:380px;height:280px;background:#c3a17a;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 28px);border-radius:20px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.cfield>span{position:absolute}
.cfield .bill{min-width:84px;height:44px;font-size:15px}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient></defs></svg>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
{
const app=document.getElementById('app');
const $=s=>app.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const today=new Date().toLocaleDateString('sv');
let day=store.get('day',{d:today,n:0});if(day.d!==today)day={d:today,n:0};
let wallet=store.get('wallet',0);
const SPEEDS=[['느리게',.6],['보통',.8],['빠르게',1]];
let spd=store.get('spd',0);
const S=()=>SPEEDS[spd][1];

/* ===== 로그인·기록 동기화 (Supabase) ===== */
const CFG=window.BRAIN_CONFIG||{};
const esc=t=>String(t??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const toast=(msg,ms=2200)=>{let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.innerHTML=msg;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='',ms)};
const Cloud={
 on:false,sb:null,user:null,profile:null,att:null,applying:false,timer:null,
 init(){
  if(!(CFG.supabaseUrl&&CFG.supabaseAnonKey&&window.supabase))return;
  this.on=true;
  this.sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  this.sb.auth.onAuthStateChange((ev,ses)=>{
   if(ev==='PASSWORD_RECOVERY'){setTimeout(resetView,0);return}
   const u=ses?ses.user:null,changed=(u&&u.id)!==(this.user&&this.user.id);this.user=u;
   if(changed){if(u)setTimeout(()=>this.afterLogin(),0);else{this.profile=null;this.att=null;refresh()}}
  });
 },
 async afterLogin(){
  try{await this.loadProfile();await this.pull();await this.checkIn()}catch(e){console.warn(e)}
  if(document.querySelector('#kk,#ef'))home();else refresh();
 },
 async loadProfile(){const{data}=await this.sb.from('profiles').select('nickname,friend_code').eq('id',this.user.id).maybeSingle();this.profile=data||{nickname:'뇌운동 친구',friend_code:'------'}},
 keys(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(best_|hist_)/.test(k)||['wallet','day','spd','attr','vote','seen'].includes(k))out[k]=store.get(k)}return out},
 async pull(){
  const{data}=await this.sb.from('user_state').select('data').eq('user_id',this.user.id).maybeSingle();
  const S=(data&&data.data)||{};
  // 이 기기에 남아 있는 기록이 '다른 계정'의 것이면 합치지 않고 버려요. 손님(로그인 전) 기록만 첫 로그인 계정에 합쳐요.
  const owner=localStorage.getItem('owner');if(owner&&owner!==this.user.id)this.clearLocal();
  const L=this.keys(),M=Object.assign({},S);
  for(const k in L){const a=L[k],b=S[k];if(b==null){M[k]=a;continue}
   if(k.startsWith('best_')||k==='wallet')M[k]=Math.max(+a||0,+b||0);
   else if(k.startsWith('hist_'))M[k]=(a||[]).length>(b||[]).length?a:b;
   else if(k==='day')M[k]=a.d===b.d?{d:a.d,n:Math.max(a.n,b.n)}:(a.d>b.d?a:b);
   else if(k==='attr')M[k]=a>b?a:b;
   else if(k==='vote')M[k]=Object.assign({},b,a);
   else if(k==='seen'){M[k]=Object.assign({},b);for(const g in a)if(!M[k][g]||a[g]>M[k][g])M[k][g]=a[g]}
   else M[k]=a}
  this.applying=true;for(const k in M)store.set(k,M[k]);this.applying=false;localStorage.setItem('owner',this.user.id);reloadVars();await this.push();
 },
 dirty(){if(!this.user||this.applying)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),1200)},
 async push(){if(!this.user)return;const{error}=await this.sb.from('user_state').upsert({user_id:this.user.id,data:this.keys(),updated_at:new Date().toISOString()});if(error)console.warn(error);
  const vj=JSON.stringify(votes()),tag=this.user.id+vj;if(this.vsync!==tag){const r=await this.sb.rpc('sync_votes',{p:votes()});if(r.error)console.warn('sync_votes',r.error);else{this.vsync=tag;loadVC(true)}}},
 async score(game,score){if(!this.user)return;const{error}=await this.sb.from('scores').insert({user_id:this.user.id,game_id:game,score});if(error)console.warn(error)},
 async checkIn(){
  const{data,error}=await this.sb.rpc('check_in');if(error){console.warn(error);return}
  this.att=data;
  if(store.get('attr','')!==data.today){ // 오늘 첫 출석 보상 (기기·계정당 하루 한 번)
   let bonus=10;if(data.streak>0&&data.streak%7===0)bonus+=50;
   wallet+=bonus;store.set('wallet',wallet);store.set('attr',data.today);
   toast(`출석 ${data.streak}일째! <b>+${bonus}P</b>${bonus>10?' (7일 연속 보너스)':''}`,3200)}
 },
 async board(game,friends){const{data,error}=await this.sb.rpc('leaderboard',{p_game:game,p_friends:friends});if(error)throw error;return data||[]},
 async friends(){const{data,error}=await this.sb.rpc('my_friends');if(error)throw error;return data||[]},
 async addFriend(code){const{data,error}=await this.sb.rpc('add_friend',{p_code:code});if(error)throw error;return data},
 async removeFriend(id){const{error}=await this.sb.rpc('remove_friend',{p_friend:id});if(error)throw error},
 async setNick(n){const{error}=await this.sb.from('profiles').update({nickname:n}).eq('id',this.user.id);if(error)throw error;this.profile.nickname=n},
 async deleteMe(){const{error}=await this.sb.rpc('delete_me');if(error)throw error;await this.sb.auth.signOut();localStorage.clear()},
 clearLocal(){const ks=Object.keys(this.keys()).filter(k=>k!=='spd');ks.forEach(k=>localStorage.removeItem(k));localStorage.removeItem('owner');reloadVars()},
 async signOut(){clearTimeout(this.timer);try{await this.push()}catch(e){}await this.sb.auth.signOut();this.clearLocal()}
};
{const _set=store.set;store.set=(k,v)=>{_set.call(store,k,v);Cloud.dirty()}}
function reloadVars(){wallet=store.get('wallet',0);day=store.get('day',{d:today,n:0});if(day.d!==today)day={d:today,n:0};spd=store.get('spd',spd)}
function refresh(){if(document.querySelector('.hero'))home()}
const nickOf=()=>Cloud.profile?Cloud.profile.nickname:'';
/* 홈 화면 설치 (PWA) */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;refresh()});
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
async function doInstall(){
 if(installEvt){installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r.outcome==='accepted')toast('홈 화면에 설치했어요!');refresh();return}
 sheet(`<h2>홈 화면에 설치하기</h2>${isIOS()?`<ol class="steps"><li>사파리 아래쪽 <b>공유 버튼</b>(네모에 위쪽 화살표)을 누르세요</li><li><b>홈 화면에 추가</b>를 누르세요</li><li>오른쪽 위 <b>추가</b>를 누르면 끝!</li></ol>`:`<ol class="steps"><li>크롬 오른쪽 위 <b>⋮ 메뉴</b>를 누르세요</li><li><b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르세요</li><li><b>설치</b>를 누르면 끝!</li></ol>`}<button class="cta" style="width:100%" data-close>알겠어요</button>`)}
function sheet(html){let s=document.getElementById('sheet');if(!s){s=document.createElement('div');s.id='sheet';document.body.appendChild(s)}
 s.innerHTML=`<div class="sbk" data-close></div><div class="sbox">${html}</div>`;s.className='show';s.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>s.className='')}
/* --- 로그인 화면 --- */
const KAKAO_ICON='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="#000" d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.2 4.7 6.6l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.5.1 1 .1 1.5.1 5.5 0 10-3.5 10-7.9S17.5 3 12 3z"/></svg>';
function loginView(mode='in'){
 stopRun();window.scrollTo(0,0);
 if(!Cloud.on){app.innerHTML=`<div class="authw"><div class="authc"><h2>로그인 준비 중</h2><p class="muted">서버 설정(config.js)이 아직 비어 있어요. 안내서의 1~3단계를 마치면 로그인할 수 있어요.</p><button class="cta soft" id="bk" style="width:100%">돌아가기</button></div></div>`;$('#bk').onclick=home;return}
 app.innerHTML=`<div class="authw"><button class="iconb back" id="bk" aria-label="뒤로">‹</button><div class="authc">${MASCOT}
 <h2>${mode==='up'?'회원가입':'로그인'}</h2><p class="muted">로그인하면 어느 기기에서나 기록이 이어지고<br>순위·친구·출석 체크를 할 수 있어요</p>
 <button class="kakao" id="kk">${KAKAO_ICON}<span>카카오 로그인</span></button>
 <div class="or"><span>또는 이메일로</span></div>
 <form id="ef" class="ef" novalidate><label>이메일<input type="email" id="em" autocomplete="email" required placeholder="example@email.com"></label>
 <label>비밀번호<input type="password" id="pw" autocomplete="${mode==='up'?'new-password':'current-password'}" minlength="6" required placeholder="6자 이상"></label>
 ${mode==='up'?'<label>닉네임<input type="text" id="nk" maxlength="12" placeholder="순위에 보일 이름 (12자까지)"></label>':''}
 <p class="msg" id="msg" role="status"></p>
 <button class="cta" type="submit" style="width:100%">${mode==='up'?'가입하기':'이메일로 로그인'}</button></form>
 <div class="alinks">${mode==='up'?'<button class="lnk" id="sw">이미 계정이 있어요 · 로그인</button>':'<button class="lnk" id="sw">처음이에요 · 회원가입</button><button class="lnk" id="fg">비밀번호를 잊었어요</button>'}</div></div></div>`;
 const msg=(t,ok)=>{const m=$('#msg');m.textContent=t;m.className='msg'+(ok?' ok':'')};
 $('#bk').onclick=home;$('#sw').onclick=()=>loginView(mode==='up'?'in':'up');
 $('#kk').onclick=async()=>{const{error}=await Cloud.sb.auth.signInWithOAuth({provider:'kakao',options:{redirectTo:location.origin+location.pathname}});if(error)msg('카카오 로그인 오류: '+error.message)};
 const fg=$('#fg');if(fg)fg.onclick=async()=>{const em=$('#em').value.trim();if(!em){msg('비밀번호를 찾을 이메일을 먼저 입력하세요');return}
  const{error}=await Cloud.sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});msg(error?error.message:'비밀번호 재설정 메일을 보냈어요. 메일함을 확인하세요.',!error)};
 $('#ef').onsubmit=async e=>{e.preventDefault();const em=$('#em').value.trim(),pw=$('#pw').value;
  if(!/^\S+@\S+\.\S+$/.test(em)){msg('이메일 주소를 확인해 주세요');return}if(pw.length<6){msg('비밀번호는 6자 이상이에요');return}
  if(mode==='up'){const nk=($('#nk').value.trim()||em.split('@')[0]).slice(0,12);
   const{data,error}=await Cloud.sb.auth.signUp({email:em,password:pw,options:{data:{nickname:nk},emailRedirectTo:location.origin+location.pathname}});
   if(error){msg(error.message.includes('registered')?'이미 가입된 이메일이에요. 로그인해 주세요.':error.message);return}
   if(!data.session)msg('확인 메일을 보냈어요. 메일의 링크를 누르면 가입이 끝나요.',true)}
  else{const{error}=await Cloud.sb.auth.signInWithPassword({email:em,password:pw});
   if(error){msg(/confirm/i.test(error.message)?'메일 인증을 먼저 해 주세요. 받은 메일의 링크를 누르세요.':'이메일 또는 비밀번호가 맞지 않아요');return}
   toast('로그인했어요!')}};
}
function resetView(){
 app.innerHTML=`<div class="authw"><div class="authc"><h2>새 비밀번호 정하기</h2><form id="rf2" class="ef"><label>새 비밀번호<input type="password" id="np" minlength="6" autocomplete="new-password" placeholder="6자 이상"></label><p class="msg" id="msg"></p><button class="cta" style="width:100%">바꾸기</button></form></div></div>`;
 $('#rf2').onsubmit=async e=>{e.preventDefault();const p=$('#np').value;if(p.length<6){$('#msg').textContent='6자 이상으로 정해 주세요';return}
  const{error}=await Cloud.sb.auth.updateUser({password:p});if(error){$('#msg').textContent=error.message;return}toast('비밀번호를 바꿨어요');home()}}
/* --- 내 정보 --- */
function accountView(){
 stopRun();window.scrollTo(0,0);if(!Cloud.user)return loginView();
 const u=Cloud.user,prov=(u.app_metadata&&u.app_metadata.provider)==='kakao'?'카카오':'이메일';
 app.innerHTML=`<div class="authw"><button class="iconb back" id="bk" aria-label="뒤로">‹</button><div class="authc left">
 <div class="me"><span class="ava big">${esc(nickOf().slice(0,1)||'뇌')}</span><div><b>${esc(nickOf())}</b><small>${prov} 로그인${u.email?' · '+esc(u.email):''}</small></div></div>

function radar(vals,prev){
 const N=CATS.length,cx=160,cy=152,R=96;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
 const poly=f=>CATS.map((_,i)=>pt(i,f(i)).map(n=>n.toFixed(1)).join(',')).join(' ');
 const rings=[100,80,60,40,20].map((v,k)=>`<polygon points="${poly(()=>v)}" class="${k%2?'r2':'r1'}"/>`).join('');
 const axes=CATS.map((_,i)=>{const[x,y]=pt(i,100);return`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="ax"/>`}).join('');
 const pv=prev&&prev.some(v=>v!=null)?`<polygon points="${poly(i=>prev[i]||0)}" class="prev"/>`:'';
 const cur=`<polygon points="${poly(i=>vals[i]||0)}" class="cur"/>`;
 const dots=CATS.map((c,i)=>{const[x,y]=pt(i,vals[i]||0);return`<circle cx="${x}" cy="${y}" r="6" fill="${CATC[c]}" stroke="#fff" stroke-width="2.5"/>`}).join('');
 const labs=CATS.map((c,i)=>{const[x,y]=pt(i,128),an=Math.abs(x-cx)<5?'middle':x>cx?'start':'end',dy=i===0?-14:0;
  const d=prev&&prev[i]!=null&&vals[i]!=null&&vals[i]!==prev[i]?vals[i]-prev[i]:0;
  return`<text x="${x}" y="${y+dy}" text-anchor="${an}" class="lb"><tspan fill="${CATC[c]}">${c}</tspan><tspan x="${x}" dy="20" class="lv">${vals[i]==null?'–':vals[i]}${d?`<tspan class="${d>0?'up':'dn'}" dx="4">${d>0?'▲':'▼'}${Math.abs(d)}</tspan>`:''}</tspan></text>`}).join('');
 return`<svg class="radar" viewBox="0 0 320 312" role="img" aria-label="능력치 그래프: ${CATS.map((c,i)=>c+' '+(vals[i]==null?'미측정':vals[i])).join(', ')}">${rings}${axes}${pv}<g class="grow">${cur}${dots}</g>${labs}</svg>`;
}

{id:'path',cat:'사고력',name:'우왕좌왕길찾기',how:'다음 칸이 왼쪽이면 왼쪽, 오른쪽이면 오른쪽 버튼을 누르세요. 잘못 누르면 길에서 떨어졌다가 다시 올라와요. 주황색 점프판을 밟으면 구멍을 훌쩍 뛰어넘고 보너스 3점을 받아요. 길에 돌멩이가 있으면 가운데 ⤴점프 버튼을 눌러 한 칸 뛰어넘으세요!',art:`<svg viewBox="0 0 100 86">${[[18,70],[34,61],[50,52],[66,43],[50,34],[34,25]].map(([x,y])=>`<path d="M${x} ${y-8}l16 9-16 9-16-9z" fill="#4cd137"/><path d="M${x-16} ${y+1}l16 9v8l-16-9z" fill="#8a5a3c"/><path d="M${x} ${y+10}l16-9v8l-16 9z" fill="#6b4430"/>`).reverse().join('')}<circle cx="18" cy="57" r="9" fill="#ffd43b"/><circle cx="15" cy="56" r="1.6" fill="#22264a"/><circle cx="21" cy="56" r="1.6" fill="#22264a"/><path d="M18 48c-1-4-5-5-7-4 2 1 3 3 7 4z" fill="#38d07a"/></svg>`,run:c=>window.THREE?path3D(c):pathG(c)},
{id:'big',cat:'계산력',name:'누가큰가요',how:'위아래 두 식 중 값이 더 큰 쪽을 누르세요. 같으면 가운데 버튼을 누르세요.',art:`<svg viewBox="0 0 100 100"><g ${FONT} font-size="17" text-anchor="middle" fill="#1b2240">${tile(10,10,80,30)}<text x="50" y="31">5×3</text><rect x="22" y="44" width="56" height="12" rx="6" fill="#ffffffaa"/><text x="50" y="53" font-size="8" fill="#6b7390">같습니다</text>${tile(10,60,80,30)}<text x="50" y="81">10+4</text></g></svg>`,run:bigger},

{id:'blocks',cat:'관찰력',name:'블록 채우기',noTimer:true,how:'아래 블록을 끌어다 네모난 판에 놓으세요. 가로줄이나 세로줄을 꽉 채우면 그 줄이 사라지며 점수를 얻어요. 놓을 곳이 없어지면 끝나요.',art:`<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="10" fill="#fff"/>${[[0,0,'#ff6b6b'],[0,1,'#ff6b6b'],[1,0,'#ff6b6b'],[3,0,'#4dabf7'],[3,1,'#4dabf7'],[3,2,'#4dabf7'],[3,3,'#4dabf7'],[1,2,'#fcc419'],[1,3,'#fcc419'],[2,3,'#fcc419'],[0,3,'#51cf66']].map(([r,q,col])=>`<rect x="${13+q*19}" y="${13+r*19}" width="17" height="17" rx="3" fill="${col}"/>`).join('')}</svg>`,run:blocks},
{id:'brick',cat:'집중력',name:'벽돌깨기',noTimer:true,how:'손가락을 화면에 대고 좌우로 움직이면 아래 막대가 따라와요. 화면을 눌렀다 떼면 공이 출발해요. 공을 튕겨서 벽돌을 모두 깨면 다음 단계! 막대 끝에 맞을수록 공이 비스듬히 날아가요. 흰 테두리 벽돌은 두 번 맞아야 깨져요. 떨어지는 아이템: ↔ 막대 길게, 🐢 공 느리게, ★ 보너스 5점. 공을 놓치면 목숨이 줄어요(목숨 3개).',art:'<svg viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="12" fill="#1f2546"/><rect x="12" y="16" width="16" height="8" rx="2" fill="#ff6b6b"/><rect x="31" y="16" width="16" height="8" rx="2" fill="#ff6b6b"/><rect x="50" y="16" width="16" height="8" rx="2" fill="#ff6b6b"/><rect x="69" y="16" width="16" height="8" rx="2" fill="#ff6b6b"/><rect x="12" y="27" width="16" height="8" rx="2" fill="#ffa94d"/><rect x="31" y="27" width="16" height="8" rx="2" fill="#ffa94d"/><rect x="50" y="27" width="16" height="8" rx="2" fill="#ffa94d"/><rect x="69" y="27" width="16" height="8" rx="2" fill="#ffa94d"/><rect x="12" y="38" width="16" height="8" rx="2" fill="#ffd43b"/><rect x="31" y="38" width="16" height="8" rx="2" fill="#ffd43b"/><rect x="50" y="38" width="16" height="8" rx="2" fill="#ffd43b"/><rect x="69" y="38" width="16" height="8" rx="2" fill="#ffd43b"/><rect x="12" y="49" width="16" height="8" rx="2" fill="#69db7c"/><rect x="31" y="49" width="16" height="8" rx="2" fill="#69db7c"/><rect x="50" y="49" width="16" height="8" rx="2" fill="#69db7c"/><rect x="69" y="49" width="16" height="8" rx="2" fill="#69db7c"/><circle cx="58" cy="66" r="5" fill="#fff"/><rect x="34" y="80" width="32" height="6" rx="3" fill="#e9ecef"/></svg>',run:breakout},{id:'hoop',cat:'집중력',name:'농구 슛',time:60,how:'아래 농구공을 손가락으로 잡고 골대 쪽으로 위로 쭉 밀었다 떼세요. 세게 밀수록 멀리 날아가요. 골인 2점, 림에 안 닿는 깔끔한 슛은 +1점, 3번 연속이면 +1점! 3골마다 골대 위치가 바뀌고, 나중엔 골대가 움직여요. 💡힌트를 쓰면 던질 길을 점선으로 보여줘요.',art:`<svg viewBox="0 0 100 100"><rect x="22" y="8" width="56" height="38" rx="4" fill="#fff" stroke="#495057" stroke-width="3"/><rect x="38" y="20" width="24" height="16" fill="none" stroke="#f03e3e" stroke-width="2.5"/><ellipse cx="50" cy="44" rx="17" ry="5" fill="none" stroke="#f03e3e" stroke-width="3.5"/><path d="M34 45l5 16h22l5-16M42 46l2 15M50 47v14M58 46l-2 15" stroke="#fff" stroke-width="1.6" fill="none"/><circle cx="66" cy="78" r="15" fill="#f76707"/><path d="M51 78h30M66 63v30M56 66c5 7 5 17 0 24M76 66c-5 7-5 17 0 24" stroke="#5c1a00" stroke-width="1.6" fill="none"/></svg>`,run:hoop},{id:'catch',cat:'집중력',name:'과일 받기',noTimer:true,how:'떨어지는 과일을 바구니로 받으세요. ◀ ▶ 버튼을 누르고 있거나 화면을 손가락으로 끌면 바구니가 움직여요. 과일 1점, ⭐ 별 3점! 💣 폭탄을 받거나 과일을 놓치면 목숨이 줄어요(목숨 3개).',art:`<svg viewBox="0 0 100 100"><text x="30" y="30" font-size="22">🍎</text><text x="62" y="46" font-size="20">🍌</text><text x="22" y="58" font-size="18">💣</text><path d="M20 66h60l-7 26H27z" fill="#c98a4b"/><rect x="16" y="62" width="68" height="8" rx="3" fill="#a8692f"/><path d="M36 70l-2 22M50 70v22M64 70l2 22" stroke="#9c6230" stroke-width="2"/></svg>`,run:fruitCatch},
{id:'chosung',cat:'언어력',name:'초성게임',how:'ㅅㄱ 처럼 낱말의 첫소리(초성)만 보여줘요. 힌트를 보고 초성이 맞는 낱말을 4개 중에서 고르세요. 처음엔 두 글자, 점점 긴 낱말이 나와요.',art:`<svg viewBox="0 0 100 100"><g ${FONT} font-size="30" text-anchor="middle" fill="#fff"><rect x="10" y="22" width="38" height="44" rx="10" fill="#e64980"/><text x="29" y="56">ㅅ</text><rect x="52" y="22" width="38" height="44" rx="10" fill="#e64980"/><text x="71" y="56">ㄱ</text></g><text x="50" y="88" ${FONT} font-size="14" text-anchor="middle" fill="#1b2240">사과?</text></svg>`,run:chosung},
{id:'wordfind',cat:'언어력',name:'영어낱말찾기',time:90,how:'글자판 속에 영어 낱말이 숨어 있어요. 위 목록의 뜻을 보고, 낱말의 첫 글자부터 마지막 글자까지 손가락으로 쓸어서 찾으세요. 첫 글자와 마지막 글자를 차례로 눌러도 돼요.',art:`<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="10" fill="#fff"/><rect x="28" y="13" width="44" height="18" rx="9" fill="#ffd43b"/><g ${FONT} font-size="13" text-anchor="middle" fill="#1b2240">${['KCATB','OSUNR','DOGAE','MLEPN'].map((row,y)=>[...row].map((ch,x)=>`<text x="${22+x*14}" y="${26+y*19}">${ch}</text>`).join('')).join('')}</g></svg>`,run:wordfind},
{id:'flags',cat:'관찰력',name:'나라국기 맞추기',how:'국기를 보고 어느 나라인지 고르세요. 가끔은 나라 이름을 보고 국기를 골라야 해요. 처음엔 잘 알려진 나라부터, 점점 비슷하게 생긴 국기가 섞여 나와요.',art:`<svg viewBox="0 0 100 100"><g transform="translate(10 14)"><rect width="50" height="34" rx="4" fill="#fff" stroke="#dee2e6" stroke-width="1.5"/><circle cx="25" cy="17" r="9" fill="#e03131"/></g><g transform="translate(40 52)"><rect width="50" height="34" rx="4" fill="#fff"/><rect width="17" height="34" rx="4" fill="#1c4ed8"/><rect x="33" width="17" height="34" rx="4" fill="#e03131"/><rect x="13" width="6" height="34" fill="#1c4ed8"/><rect x="31" width="6" height="34" fill="#e03131"/></g></svg>`,run:flags},
{id:'capitals',cat:'기억력',name:'나라수도맞추기',how:'나라 이름과 국기를 보고 그 나라의 수도를 고르세요. 가끔은 수도를 보고 나라를 골라야 해요. 뉴욕·시드니처럼 크지만 수도가 아닌 도시가 함정으로 섞여 나와요.',art:`<svg viewBox="0 0 100 100"><rect x="10" y="12" width="80" height="44" rx="12" fill="#fff"/><text x="50" y="42" ${FONT} font-size="17" text-anchor="middle" fill="#1b2240">프랑스</text><path d="M50 62c-9 0-15 6-15 14 0 10 15 20 15 20s15-10 15-20c0-8-6-14-15-14z" fill="#7950f2"/><circle cx="50" cy="76" r="5.5" fill="#fff"/></svg>`,run:capitals},
{id:'puzzle',cat:'관찰력',name:'그림퍼즐',time:90,how:'그림이 조각조각 섞여 있어요. 두 조각을 차례로 누르거나 끌어다 놓아 자리를 바꾸고, 왼쪽 위 작은 원본 그림처럼 맞추세요. 맞는 자리에 간 조각마다 1점, 그림을 완성하면 보너스예요. 3×3에서 시작해 5×5까지 커져요.',art:`<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="10" fill="#fff"/>${[[0,0,'#6ec6ff'],[1,0,'#ffd43b'],[2,0,'#6ec6ff'],[0,1,'#69db7c'],[1,1,'#e03131'],[2,1,'#69db7c'],[0,2,'#40c057'],[1,2,'#f2cc8f'],[2,2,'#40c057']].map(([x,y,col])=>`<rect x="${13+x*25.5}" y="${13+y*25.5}" width="23" height="23" rx="4" fill="${col}"/>`).join('')}<rect x="38.5" y="38.5" width="23" height="23" rx="4" fill="none" stroke="#f59f00" stroke-width="3"/></svg>`,run:puzzle},
{id:'hidden',cat:'관찰력',name:'숨은그림찾기',time:90,how:'그림 속 여러 물건 사이에 위 목록의 물건이 숨어 있어요. 찾아서 누르면 2점! 다른 물건을 누르면 땡이에요. 도저히 안 보이면 포인트로 💡힌트를 쓸 수 있어요.',art:`<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="10" fill="#d0ebff"/><path d="M8 62q30-14 84 0v20a10 10 0 0 1-10 10H18a10 10 0 0 1-10-10z" fill="#8ce99a"/><circle cx="62" cy="44" r="14" fill="none" stroke="#f59f00" stroke-width="4"/><path d="M72 54l12 12" stroke="#f59f00" stroke-width="6" stroke-linecap="round"/><circle cx="28" cy="30" r="5" fill="#ff6b6b"/><rect x="22" y="66" width="10" height="10" rx="2" fill="#9775fa"/><path d="M58 44l4-6 4 6z" fill="#ffd43b"/></svg>`,run:hidden},
{id:'blank',cat:'계산력',name:'빈칸 채우기',how:'"7 + ? = 15"처럼 식의 빈칸에 들어갈 숫자를 4개 중에서 고르세요. 점수가 오르면 곱셈·나눗셈도 나와요.',art:`<svg viewBox="0 0 100 100"><g ${FONT} font-size="22" text-anchor="middle" fill="#1b2240"><text x="20" y="58">7</text><text x="36" y="58">+</text><rect x="44" y="36" width="24" height="30" rx="6" fill="#228be6"/><text x="56" y="58" fill="#fff">?</text><text x="76" y="58">=</text><text x="92" y="58" font-size="17">15</text></g></svg>`,run:blank},
{id:'sumg',cat:'계산력',name:'숫자 합 만들기',how:'숫자 타일을 골라 더해서 목표 숫자를 만드세요. 딱 맞으면 고른 타일이 사라지고 고른 개수만큼 점수를 받아요. 목표보다 커지면 처음부터 다시 골라야 해요.',art:`<svg viewBox="0 0 100 100"><g ${FONT} font-size="16" text-anchor="middle">${[[0,0,3,1],[1,0,7,1],[2,0,5,0],[0,1,2,0],[1,1,4,0],[2,1,8,0]].map(([x,y,v,on])=>`<rect x="${10+x*28}" y="${28+y*30}" width="24" height="26" rx="6" fill="${on?'#228be6':'#fff'}"/><text x="${22+x*28}" y="${47+y*30}" fill="${on?'#fff':'#1b2240'}">${v}</text>`).join('')}<text x="50" y="18" font-size="13" fill="#228be6">목표 10</text></g></svg>`,run:sumG},
{id:'change',cat:'계산력',name:'거스름돈 계산',time:90,how:'물건값과 낸 돈을 보고 거스름돈을 계산해서 돈을 눌러 담으세요. 맞으면 2점, 지폐와 동전을 가장 적게 써서 맞추면 1점 더 받아요.',art:`<svg viewBox="0 0 100 100"><rect x="10" y="28" width="56" height="30" rx="5" fill="#ffa94d"/><text x="38" y="48" ${FONT} font-size="11" text-anchor="middle" fill="#1b2240">5천원</text><circle cx="72" cy="66" r="14" fill="#dee2e6" stroke="#adb5bd" stroke-width="2"/><text x="72" y="70" ${FONT} font-size="9" text-anchor="middle" fill="#1b2240">500</text><circle cx="48" cy="74" r="11" fill="#ced4da" stroke="#adb5bd" stroke-width="2"/><text x="48" y="77.5" ${FONT} font-size="8" text-anchor="middle" fill="#1b2240">100</text></svg>`,run:change},
{id:'chain',cat:'계산력',name:'연속 계산',how:'처음 숫자가 나온 뒤 +5, ×2 같은 계산이 하나씩 나와요. 머릿속으로 이어서 계산한 다음, 마지막 결과를 고르세요. 점수가 오르면 계산 단계가 늘어나요.',art:`<svg viewBox="0 0 100 100"><g ${FONT} font-size="15" text-anchor="middle" fill="#1b2240"><rect x="6" y="38" width="22" height="24" rx="6" fill="#fff"/><text x="17" y="55">3</text><text x="34" y="55" fill="#228be6">→</text><rect x="40" y="38" width="22" height="24" rx="6" fill="#fff"/><text x="51" y="55" font-size="12">+5</text><text x="68" y="55" fill="#228be6">→</text><rect x="74" y="38" width="22" height="24" rx="6" fill="#fff"/><text x="85" y="55" font-size="12">×2</text></g></svg>`,run:chain},
{id:'clock',cat:'계산력',name:'시계 계산',how:'시계가 가리키는 시각을 보고 "2시간 30분 뒤"처럼 정해진 시간이 지난 뒤(또는 전)의 시각을 고르세요.',art:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="#fff" stroke="#2b3350" stroke-width="5"/><line x1="50" y1="50" x2="50" y2="28" stroke="#228be6" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="66" y2="58" stroke="#1b2240" stroke-width="5" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#fa5252"/></svg>`,run:clockG},
{id:'coins',cat:'계산력',name:'동전 세기',how:'흩어져 있는 지폐와 동전을 모두 더하면 얼마인지 고르세요. 점수가 오르면 돈의 개수와 종류가 늘어나요.',art:`<svg viewBox="0 0 100 100"><rect x="14" y="20" width="50" height="28" rx="4" fill="#74c0fc" transform="rotate(-10 39 34)"/><rect x="36" y="44" width="50" height="28" rx="4" fill="#8ce99a" transform="rotate(8 61 58)"/><circle cx="28" cy="72" r="13" fill="#dee2e6" stroke="#adb5bd" stroke-width="2"/><circle cx="76" cy="26" r="10" fill="#e8a87c" stroke="#c97b4a" stroke-width="2"/></svg>`,run:coins},
{id:'balloon',cat:'계산력',name:'숫자 풍선 터뜨리기',how:'위에 나온 목표 숫자와 답이 같은 풍선만 눌러서 터뜨리세요. 예) 목표가 18이면 6×3, 20−2 풍선! 다른 풍선을 누르면 땡이에요. 4개를 터뜨리면 목표 숫자가 바뀌어요.',art:`<svg viewBox="0 0 100 100"><g ${FONT} font-size="10" text-anchor="middle" fill="#fff">${[[30,40,'#ff6b6b','6×3'],[70,30,'#4dabf7','9+9'],[52,62,'#ffa94d','20−2']].map(([x,y,col,t])=>`<path d="M${x} ${y+20}q-3 8 2 14" stroke="#868e96" fill="none"/><ellipse cx="${x}" cy="${y}" rx="15" ry="18" fill="${col}"/><text x="${x}" y="${y+4}">${t}</text>`).join('')}</g></svg>`,run:balloons},
{id:'bbq',cat:'집중력',name:'바비큐!',how:'위에 주문한 꼬치를 보고, 아래 재료를 왼쪽부터 순서대로 눌러 똑같이 끼우세요. 순서가 틀리면 처음부터 다시 끼워야 해요.',art:'<span class="emo" style="font-size:50px">🍢</span>',run:bbq},
{id:'lights',cat:'집중력',name:'신호등 반응',how:'불이 바뀌는 순간을 잘 보다가, 초록불이 켜지면 재빨리 누르세요. 노란불이나 빨간불에 누르면 1점 깎이고, 초록불을 놓쳐도 1점 깎여요. 갈수록 초록불이 짧아져요!',art:'<span class="emo" style="font-size:50px">🚦</span>',run:lights},
{id:'stroop',cat:'집중력',name:'글자색 맞추기',how:'"빨강"이라는 글자가 파란색으로 쓰여 있으면 정답은 파랑! 글자의 뜻이 아니라 글자의 색깔을 고르세요.',art:'<span style="font-size:30px;font-weight:900;color:#1b2240;line-height:1.15"><span style="color:#1c7ed6">빨강</span></span>',run:stroop},
{id:'cipher',cat:'집중력',name:'암호 풀기',how:'위 암호표에는 기호마다 짝지어진 숫자가 있어요. 가운데 크게 나온 기호의 숫자를 암호표에서 찾아 빠르게 누르세요. 12번 맞히면 암호표가 바뀌어요.',art:'<svg viewBox="0 0 100 100"><rect x="6" y="14" width="88" height="40" rx="8" fill="#fff"/><g font-weight="900" text-anchor="middle" font-family="Gothic A1,sans-serif"><text x="22" y="32" font-size="15" fill="#12b886">★</text><text x="50" y="32" font-size="15" fill="#12b886">▲</text><text x="78" y="32" font-size="15" fill="#12b886">●</text><text x="22" y="48" font-size="13" fill="#1b2240">1</text><text x="50" y="48" font-size="13" fill="#1b2240">2</text><text x="78" y="48" font-size="13" fill="#1b2240">3</text><text x="50" y="88" font-size="28" fill="#12b886">▲</text></g></svg>',run:cipher},
{id:'schulte',cat:'집중력',name:'순서대로 누르기',how:'섞여 있는 숫자를 1부터 순서대로 빠르게 누르세요. 판을 끝내면 점수를 받고 더 큰 판(4×4 → 5×5 → 6×6)이 나와요.',art:'<span style="font-size:28px;font-weight:900;color:#1b2240;line-height:1.15">1 2<br>3 ?</span>',run:schulte},
{id:'rhythm',cat:'집중력',name:'리듬 블록',how:'네 줄에서 블록이 떨어져요. 블록이 아래 하얀 선에 닿는 순간 그 줄의 버튼(또는 그 줄)을 누르세요. 딱 맞으면 "완벽!" 2점, 조금 어긋나면 1점. 10콤보마다 보너스가 있어요.',art:`<svg viewBox="0 0 100 100"><rect x="8" y="6" width="84" height="88" rx="10" fill="#1f2547"/>${['#ff6b6b','#ffd43b','#51cf66','#4dabf7'].map((col,i)=>`<rect x="${12+i*20.5}" y="${[18,44,30,58][i]}" width="17" height="9" rx="3" fill="${col}"/>`).join('')}<rect x="10" y="72" width="80" height="3" rx="1.5" fill="#fff"/></svg>`,run:rhythm},
{id:'scales',cat:'사고력',name:'무게 비교',how:'저울을 보고 어느 쪽이 더 무거운지 따져서, 가장 무거운(또는 가벼운) 것을 고르세요. 아래로 기운 쪽이 더 무거워요.',art:'<span class="emo" style="font-size:50px">⚖️</span>',run:scales},
{id:'seq',cat:'사고력',name:'규칙 찾기',how:'2, 4, 6, 8, ? 처럼 숫자가 늘어서는 규칙을 찾아 ?에 들어갈 수를 고르세요.',art:'<span style="font-size:28px;font-weight:900;color:#1b2240;line-height:1.15">2 4 6 <span style="color:#f03e3e">?</span></span>',run:seqG},
{id:'maze',cat:'사고력',name:'미로 탈출',time:90,how:'화살표 버튼을 누르거나 미로 위를 손가락으로 밀어서 깃발까지 가세요. 탈출할 때마다 미로가 커져요.',art:'<span class="emo" style="font-size:46px">🏁</span>',run:maze},
{id:'arrows',cat:'사고력',name:'화살표 퍼즐',noTimer:true,how:'화살표를 누르면 머리가 가리키는 방향으로 쭉 빠져나가요. 앞에 다른 화살표가 있으면 부딪혀서 💧물방울이 하나 줄어요(3개). 빠져나갈 수 있는 순서를 잘 생각해서 화살표를 모두 없애면 다음 레벨! 화살표 1개당 1점, 레벨 통과 5점. 💡힌트를 쓰면 지금 뺄 수 있는 화살표를 알려줘요.',art:`<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="10" fill="#f6ecdc"/><g fill="none" stroke="#6b4a2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 30h26v-12"/><path d="M80 22v30H58"/><path d="M22 78V48h22v18h12"/><path d="M66 80h14V66"/></g><g fill="#6b4a2b"><path d="M46 10l-6 9h12z"/><path d="M50 52l9-6v12z"/><path d="M64 66l-9-6v12z"/><path d="M80 58l-6 9h12z"/></g></svg>`,run:arrowOut},{id:'hanoi',cat:'사고력',name:'하노이탑',time:120,how:'왼쪽 기둥의 원판을 모두 오른쪽 기둥으로 옮기세요. 기둥을 눌러 맨 위 원판을 고르고, 옮길 기둥을 누르면 돼요. 큰 원판은 작은 원판 위에 올릴 수 없어요. 최소 횟수로 끝내면 보너스! 막히면 💡힌트로 다음 수를 알려줘요.',art:'<span style="font-size:34px;font-weight:900;color:#1b2240;line-height:1.15"><svg viewBox="0 0 100 70" width="90"><rect x="18" y="10" width="4" height="50" fill="#868e96"/><rect x="48" y="10" width="4" height="50" fill="#868e96"/><rect x="78" y="10" width="4" height="50" fill="#868e96"/><rect x="4" y="50" width="32" height="10" rx="4" fill="#ff6b6b"/><rect x="9" y="40" width="22" height="10" rx="4" fill="#4dabf7"/><rect x="14" y="30" width="12" height="10" rx="4" fill="#ffd43b"/></svg></span>',run:hanoi},
{id:'rotate',cat:'사고력',name:'도형 회전',how:'빨간 도형을 <b>돌리기만</b> 해서 만들 수 있는 모양을 고르세요. 뒤집은 모양은 정답이 아니에요.',art:'<span style="font-size:34px;font-weight:900;color:#1b2240;line-height:1.15"><svg viewBox="0 0 70 70" width="70"><g fill="#f03e3e"><rect x="22" y="2" width="20" height="20" rx="3"/><rect x="44" y="2" width="20" height="20" rx="3"/><rect x="0" y="24" width="20" height="20" rx="3"/><rect x="22" y="24" width="20" height="20" rx="3"/><rect x="22" y="46" width="20" height="20" rx="3"/></g></svg></span>',run:rotateG},

{id:'newitem',noTimer:true,cat:'기억력',name:'새로운 물건 찾기',how:'물건들을 기억하세요. 다시 보여줄 때 새로 하나가 끼어 있어요. 새로 생긴 물건을 찾으면 물건이 하나씩 늘어나요. 시간 제한은 없고, 틀리면 목숨이 줄어요(목숨 3개).',art:'<span class="emo" style="font-size:30px">🔑🎈<br>⏰<span style="color:#7950f2">?</span></span>',run:newItem},

{id:'chainw',cat:'언어력',name:'끝말잇기',how:'앞 낱말의 마지막 글자로 시작하는 낱말을 고르세요. 예) 기차 → 차표',art:'<span style="font-size:26px;font-weight:900;color:#1b2240;line-height:1.15">기<span style="color:#e64980">차</span><br><span style="color:#e64980">차</span>표</span>',run:wordChain},

/* ===== 소리: 배경음악(BGM)과 효과음 — 파일 없이 브라우저에서 직접 만들어요 ===== */
const Snd={
 ac:null,master:null,bgmG:null,fxG:null,timer:null,step:0,next:0,song:null,
 pref:store.get('snd',{bgm:true,fx:true}),
 save(){store.set('snd',this.pref)},
 ctx(){if(!this.ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;this.ac=new A();
   this.master=this.ac.createGain();this.master.gain.value=.8;this.master.connect(this.ac.destination);
   this.bgmG=this.ac.createGain();this.bgmG.gain.value=.22;this.bgmG.connect(this.master);
   this.fxG=this.ac.createGain();this.fxG.gain.value=.5;this.fxG.connect(this.master)}
  if(this.ac.state==='suspended')this.ac.resume();return this.ac},
 note(freq,t,dur,{type='triangle',vol=.3,out,attack=.01,glide}={}){const a=this.ac;if(!a)return;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(out||this.fxG);o.start(t);o.stop(t+dur+.05)},
 hz:m=>440*Math.pow(2,(m-69)/12),
 /* 효과음 */
 fx(kind){if(!this.pref.fx||!this.ctx())return;const t=this.ac.currentTime,h=this.hz,N=(f,d,o,off=0)=>this.note(f,t+off,d,o);
  if(kind==='ok'){N(h(84),.12,{vol:.35});N(h(91),.18,{vol:.3},.07)}
  else if(kind==='big'){[72,76,79,84].forEach((m,i)=>N(h(m),.22,{vol:.3},i*.07))}
  else if(kind==='bad'){N(220,.22,{type:'square',vol:.12,glide:140});N(180,.25,{type:'sawtooth',vol:.06,glide:110},.05)}
  else if(kind==='tap'){N(h(96),.05,{type:'sine',vol:.12})}
  else if(kind==='tick'){N(h(88),.06,{type:'square',vol:.06})}
  else if(kind==='help'){[79,83,86].forEach((m,i)=>N(h(m),.15,{type:'sine',vol:.25},i*.05))}
  else if(kind==='end'){[[72,0],[76,.12],[79,.24],[84,.36],[79,.6],[84,.72]].forEach(([m,o],i)=>N(h(m),i>3?.5:.16,{vol:.3},o))}
  else if(kind==='start'){[67,72].forEach((m,i)=>N(h(m),.14,{type:'sine',vol:.25},i*.09))}},
 /* 배경음악: 분야마다 조·빠르기가 다르고, 게임마다 멜로디가 달라요 */
 start(g){this.stop();if(!this.pref.bgm||!this.ctx())return;
  const CAT={집중력:[62,132],사고력:[57,96],관찰력:[60,108],기억력:[65,92],계산력:[64,116],언어력:[67,100]}[g.cat]||[60,104];
  let seed=[...g.id].reduce((a,ch)=>a*31+ch.charCodeAt(0)>>>0,7);const r=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296;
  const pent=[0,2,4,7,9,12,14,16],prog=[[0,4,7],[7,11,14],[9,12,16],[5,9,12]];
  const mel=Array.from({length:64},(_,i)=>i%2&&r()<.55?null:(r()<.18?null:pent[Math.floor(r()*pent.length)]));
  this.song={key:CAT[0],spb:60/CAT[1]/2,prog,mel};this.step=0;this.next=this.ac.currentTime+.15;
  this.timer=setInterval(()=>this.sched(),80)},
 sched(){const a=this.ac,s=this.song;if(!a||!s)return;
  while(this.next<a.currentTime+.3){const i=this.step%64,bar=Math.floor(i/16),ch=s.prog[bar],t=this.next,k=s.key,h=this.hz,o=this.bgmG;
   if(i%8===0)this.note(h(k-12+ch[0]),t,s.spb*3.5,{type:'sine',vol:.5,out:o,attack:.02});
   if(i%4===2)ch.forEach(n=>this.note(h(k+n),t,s.spb*1.2,{type:'triangle',vol:.12,out:o,attack:.02}));
   if(i%2===0&&s.mel[i]!=null)this.note(h(k+12+s.mel[i]),t,s.spb*1.6,{type:'triangle',vol:.22,out:o,attack:.015});
   if(i%4===0)this.note(1800,t,.03,{type:'square',vol:.025,out:o});
   this.next+=s.spb;this.step++}},
 stop(){clearInterval(this.timer);this.timer=null;this.song=null},
 toggleBgm(on,g){this.pref.bgm=on;this.save();if(on&&g)this.start(g);else this.stop()},

};
